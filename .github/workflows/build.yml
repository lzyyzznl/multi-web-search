name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Vet
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.23']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: go vet
        run: go vet ./...
        working-directory: src

      - name: go test
        run: go test ./... -v
        working-directory: src

  build:
    name: Build binaries
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all platforms
        run: bash build.sh
        working-directory: src

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-web-search-binaries
          path: dist/

  release:
    name: Release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Build all platforms
        run: bash build.sh
        working-directory: src

      - name: Create Release & upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # dist/ 资产名 = multi-web-search-${GOOS}-${GOARCH}，与 launcher 请求名一致
          gh release create "$tag" dist/* \
            --title "$tag" \
            --generate-notes
